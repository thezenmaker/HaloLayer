<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HaloLayer preview</title>
  <desc id="desc">A stylized Finder window showing file metadata and a folder count badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131a"/>
      <stop offset="1" stop-color="#24213a"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79d6ff"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="42" fill="url(#bg)"/>
  <circle cx="1040" cy="94" r="180" fill="#8b7cf6" opacity=".10"/>
  <circle cx="138" cy="548" r="210" fill="#5ed7c6" opacity=".08"/>
  <text x="80" y="96" fill="#f6f4ff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="48" font-weight="700">HaloLayer</text>
  <text x="82" y="132" fill="#aaa8ba" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="19">The missing metadata layer for Finder.</text>
  <g filter="url(#shadow)">
    <rect x="80" y="170" width="1040" height="380" rx="22" fill="#f4f4f6"/>
    <path d="M80 192a22 22 0 0 1 22-22h996a22 22 0 0 1 22 22v48H80z" fill="#e7e7eb"/>
    <circle cx="116" cy="205" r="7" fill="#ff5f57"/><circle cx="140" cy="205" r="7" fill="#febc2e"/><circle cx="164" cy="205" r="7" fill="#28c840"/>
    <rect x="490" y="188" width="220" height="34" rx="10" fill="#d9d9de"/>
    <text x="600" y="211" text-anchor="middle" fill="#55545c" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="600">Creative</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" text-anchor="middle">
    <g transform="translate(245 300)">
      <path d="M-54 4h45l14 14h58v78a13 13 0 0 1-13 13h-104a13 13 0 0 1-13-13V17A13 13 0 0 1-54 4z" fill="url(#folder)"/>
      <path d="M-67 30h130v66a13 13 0 0 1-13 13h-104a13 13 0 0 1-13-13z" fill="#63bff7"/>
      <circle cx="57" cy="98" r="22" fill="#6d6b73" stroke="#f4f4f6" stroke-width="4"/>
      <text x="57" y="104" fill="white" font-size="15" font-weight="700">27</text>
      <text x="0" y="145" fill="#24242a" font-size="17" font-weight="600">Materials</text>
      <text x="0" y="169" fill="#777680" font-size="14">8.4 GB</text>
    </g>
    <g transform="translate(530 300)">
      <rect x="-64" y="0" width="128" height="104" rx="13" fill="#ded8ff"/>
      <circle cx="28" cy="30" r="15" fill="#fff4ae"/>
      <path d="M-64 84l34-35 28 27 21-19 45 47H-64z" fill="#786dd4"/>
      <text x="0" y="145" fill="#24242a" font-size="17" font-weight="600">Mountain.heic</text>
      <text x="0" y="169" fill="#777680" font-size="14">4.8 MB  ·  4032 × 3024</text>
    </g>
